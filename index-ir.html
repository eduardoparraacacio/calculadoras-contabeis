<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CALCULA SEU IMPOSTO DE RENDA</title>

<style>

body{
    font-family: Arial;
    text-align: center;
    margin-top: 100px;
    background: #eee;
}

.box{
    background: white;
    width: 250px;
    margin: auto;
    padding: 15px;
    border: 1px solid #ccc;
    border-radius: 15px;
}

input{
    width: 90%;
    padding: 8px;
    border: 1px solid #000000;
    border-radius: 10px;
}

button{
    background: #1900ff;
    color: white;
    margin-top: 10px;
    padding: 8px;
    width: 95%; 
    border-radius: 10px;
    border: 1px solid #1900ff;
}



</style>
</head>

<body>

<div class="box">

    <h3>CALCULA SEU IMPOSTO DE RENDA 🫵</h3>

    <input id="salario" type="number" placeholder="seu salário bruto">

    <button onclick="CALCULAR()">CALCULAR</button>

    <p id="res"></p>

</div>

<script>

function CALCULAR(){

    const salarioBase = Number(document.getElementById("salario").value)

    let ir = 0

    if(salarioBase < 5000){

        ir = 0

    }else if(salarioBase >= 5000 && salarioBase <= 7350){

        let reducao = 978.62 - (0.13314 * salarioBase)

        ir = salarioBase * 0.275 - 908.73 - reducao

    }else {

        ir = salarioBase * 0.275 - 908.73
    }

    let salarioLiquido = salarioBase - ir

    document.getElementById("res").innerHTML =
    "💸 Imposto de Renda: R$ " + ir.toFixed(2) +
    "<br><br>" +
    "✅ Salário Líquido: R$ " + salarioLiquido.toFixed(2)

}

</script>

</body>
</html>
