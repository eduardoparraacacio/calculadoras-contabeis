<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Calculadora INSS</title>

<style>

body{
    font-family: Arial;
    text-align: center;
    margin-top: 100px;
    background: #eee;
}

.box{
    background: white;
    width: 250px;
    margin: auto;
    padding: 15px;
    border: 1px solid #ccc;
}

input{
    width: 90%;
    padding: 8px;
    border: 1px solid #000000;
    border-radius: 10px;
}

button{
    background: #1900ff;
    color: white;
    margin-top: 10px;
    padding: 8px;
    width: 95%; 
    border-radius: 10px;
    border: 1px solid #1900ff;
}

#res{
    margin-top: 15px;
    font-size: 18px;
}

</style>
</head>

<body>

<div class="box">

    <h3>CALCULE SEU INSS 🫵</h3>

    <input id="SALARIO" type="number" placeholder="SEU SALÁRIO BRUTO">

    <button onclick="CALCULAR()">CALCULAR</button>

    <p id="res"></p>

</div>

<script>

function CALCULAR(){

    const salarioBruto = Number(document.getElementById("SALARIO").value)

    let inss = 0 

    if(salarioBruto <= 1621){
        inss = salarioBruto * 0.075

    }else if(salarioBruto > 1621 && salarioBruto <= 2902.84){
        inss = (salarioBruto - 1621) * 0.09 + 121.58

    }else if(salarioBruto > 2902.84 && salarioBruto <= 4354.27){
        inss = (salarioBruto - 2902.84) * 0.12 + 115.37 + 121.58

    }else if(salarioBruto > 4354.27 && salarioBruto <= 8475.55){
        inss = (salarioBruto - 4354.27) * 0.14 + 115.37 + 121.58 + 174.17

    }else{
        inss = 988.10
    }

    let salarioLiquido = salarioBruto - inss

    document.getElementById("res").innerHTML =
    "INSS💰: R$ " + inss.toFixed(2) +
    "<br><br>" +
    "SALARIO BRUTO💲: R$ " + salarioBruto.toFixed(2) +
    "<br><br>" +
    "SALARIO LÍQUIDO💸: R$ " + salarioLiquido.toFixed(2)

}

</script>

</body>
</html>
